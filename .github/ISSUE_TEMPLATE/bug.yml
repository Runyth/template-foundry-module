name: Bug report
description: Report a reproducible module defect.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Defect
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
    validations:
      required: true
  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and protected campaign content.
