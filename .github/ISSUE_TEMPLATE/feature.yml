name: Feature request
description: Propose a compatible, maintainable improvement.
title: "Feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which concrete workflow is difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Identify affected flags, packs, APIs, systems, or integrations.
